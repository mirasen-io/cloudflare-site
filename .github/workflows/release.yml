name: Release

# Changeset-driven site release for the private @mirasen/main-website package,
# plus Cloudflare Workers deployment via cloudflare/wrangler-action@v4.
#
# Why no kt-workflows/actions/npm-release@main?
#   The wrapper is technically capable here (checkout: false, working-directory,
#   published output) but is semantically tied to npm-package releases. This
#   site is private and never publishes to npm, so we invoke changesets/action@v1
#   directly. See openspec/changes/add-github-actions-workflows/design.md
#   Decision 4.1.
#
# How GitHub Releases happen without npm publish:
#   .changeset/config.json sets privatePackages: { version: true, tag: true }.
#   With that, `changeset publish` skips `npm publish` for the private package
#   but still emits a `🦋  New tag: <name>@<version>` line on stdout.
#   `changesets/action@v1` parses that line, sets `published=true`, and creates
#   a Git tag and a GitHub Release for each tag entry.
#
# Fallback if Changesets ever drops the tag-emit for private packages:
#   Detect `steps.changesets.outputs.published == 'false'` while the Version PR
#   was merged, then run `gh release create "<tag>" --notes-file CHANGELOG.md`
#   (or `softprops/action-gh-release`) before the deploy step.

on:
  workflow_run:
    workflows: ['CI']
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # tag + GitHub Release (changesets/action)
  pull-requests: write # to create the version PR (changesets/action)

jobs:
  release:
    runs-on: ubuntu-latest
    if: >-
      github.repository == 'mirasen-io/cloudflare-site' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.conclusion == 'success')
      )
    steps:
      - id: app-token
        uses: kt-workflows/actions/create-github-app-token@main
        with:
          app-id: ${{ secrets.WORKFLOW_APP_ID }}
          private-key: ${{ secrets.WORKFLOW_APP_PRIVATE_KEY }}
          configure-git: false
          default-to-github-token: true

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}

      # Install and build the site from workflow root.
      # @mirasen/chessboard is consumed from the npm registry, no sibling checkout needed.
      #
      # matrix-node-version-earliest: true picks the lowest Node from the matrix
      # (= oldest npm) so the package-lock.json that `changeset:version` emits is
      # readable by every Node in the CI matrix. npm 11 (Node 24) strips optional
      # peer dependency entries that npm 10 (Node 22) still requires for `npm ci`,
      # which would break the Version Packages PR's CI on the older matrix entry.
      - uses: kt-workflows/actions/npm-run-script@main
        with:
          matrix-node-version: ${{ vars.MATRIX_NODE_VERSION }}
          matrix-node-version-earliest: true
          install-script: |
            npm ci
          run-script: |
            npm run build

      - id: changesets
        uses: changesets/action@v1
        with:
          version: npm run changeset:version
          publish: npm run changeset:publish
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - if: ${{ steps.changesets.outputs.published == 'true' }}
        name: Cloudflare deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --tag ${{ github.sha }}
